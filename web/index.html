<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GameShelf</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="gs-header">
    <div class="gs-header-row">
      <button id="gs-refresh-trigger" class="gs-refresh" type="button" aria-label="Refresh game library">
        <img src="gameshelf_icon.png" class="gs-logo-icon" alt="">
        <span id="gs-logo-text" class="gs-logo-text">GAMESHELF</span>
      </button>

      <!-- Sort control -->
      <div class="gs-search-wrapper">
        <div class="gs-search-field">
          <svg class="gs-search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
          </svg>
          <input
            id="search-input"
            class="gs-search"
            type="search"
            placeholder="Search games…"
            aria-label="Search games by name"
          />
          <button id="clear-search" class="gs-search-clear hidden" type="button" aria-label="Clear search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>

        <div class="gs-sort">
          <button id="random-game" class="gs-view-toggle gs-random" type="button"
                  aria-label="Suggest a random game" title="Add games to enable random suggestions" disabled>
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <g transform="rotate(9 20 11)">
                <rect x="11" y="3" width="17" height="17" rx="3"/>
                <circle cx="16" cy="8" r="1.25"/><circle cx="23" cy="8" r="1.25"/>
                <circle cx="16" cy="15" r="1.25"/><circle cx="23" cy="15" r="1.25"/>
              </g>
              <g transform="rotate(-8 11 20)">
                <rect x="3" y="11" width="17" height="17" rx="3"/>
                <circle cx="8" cy="16" r="1.25"/><circle cx="15" cy="16" r="1.25"/>
                <circle cx="11.5" cy="19.5" r="1.25"/>
                <circle cx="8" cy="23" r="1.25"/><circle cx="15" cy="23" r="1.25"/>
              </g>
            </svg>
          </button>

          <button id="sort-button"
          class="gs-sort-button"
          aria-label="Sort by"
          title="Sort by">
            <svg viewBox="0 0 24 24">
              <path d="M3 6h14v2H3V6zm0 5h10v2H3v-2zm0 5h6v2H3v-2zm16-9 4 4-4 4V7z"/>
            </svg>
          </button>

          <button
            id="view-toggle"
            class="gs-view-toggle"
            aria-label="Toggle list view"
            title="Toggle list view">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/>
            </svg>
          </button>

          <button id="build-info" class="gs-view-toggle gs-build-info" type="button"
                  aria-label="Version information" aria-describedby="version-label">
            <svg viewBox="0.8 0 24 24" aria-hidden="true">
              <path d="M19.14 12.94a7.98 7.98 0 000-1.88l2.03-1.58-2-3.46-2.39.96a8.1 8.1 0 00-1.63-.94L14.8 3h-4l-.35 3.04c-.58.23-1.12.55-1.63.94l-2.39-.96-2 3.46 2.03 1.58a7.98 7.98 0 000 1.88l-2.03 1.58 2 3.46 2.39-.96c.51.39 1.05.71 1.63.94L10.8 21h4l.35-3.04c.58-.23 1.12-.55 1.63-.94l2.39.96 2-3.46-2.03-1.58zM12.8 16a4 4 0 110-8 4 4 0 010 8z"/>
            </svg>
            <span id="version-label" class="gs-version-tooltip" role="tooltip">Loading version…</span>
          </button>

          <div id="sort-menu" class="gs-sort-menu hidden">
            <button data-sort="az">A to Z</button>
            <button data-sort="za">Z to A</button>
            <button data-sort="size-desc">Size: High to Low</button>
            <button data-sort="size-asc">Size: Low to High</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="gs-main">
    <p id="suggestion-status" class="gs-sr-only" role="status" aria-live="polite"></p>
    <p id="loading-state" class="gs-empty" role="status">Loading games…</p>

    <section id="error-state" class="gs-error hidden" role="alert">
      <h2 id="error-title">Could not load games.</h2>
      <p id="error-message"></p>
      <button id="retry-button" class="gs-button" type="button">Retry</button>
    </section>

    <section id="games-container" class="gs-grid">
      <!-- Cards inserted by app.js -->
    </section>

    <section id="empty-state" class="gs-empty hidden" role="status">
      <h2 id="empty-title">No games found!</h2>
      <p id="search-hint" class="hidden">Try a different search or press Escape to clear it.</p>

      <!-- Subheader to be omitted during search function-->
      <p id="empty-hint" class="gs-empty-hint">
        Drop folders into your <code>GAMESHELF_ROOT</code> directory and refresh the page to display game cards. 
        View the <a href="https://github.com/ShannonWetnight/gameshelf?tab=readme-ov-file#recommended-file-structure" target="_blank">GameShelf README</a> for more information.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
