---
services:
  gameshelf:
    image: ghcr.io/shannonwetnight/gameshelf:latest
    container_name: gameshelf
    restart: unless-stopped
    ports:
      - 8080:8080 # Increment if in-use
    environment:
      # Directory containing indexable folders. 
      - GAMESHELF_ROOT=/games
      # Optional: Change GameShelf's default (8080) internal bind address
      #- GAMESHELF_ADDR=:8080
    volumes:
      - /path/to/games:/games:ro
      - gameshelf-data:/data # Docker creates this automatically; no host directory needed.
    security_opt:
      - no-new-privileges:true

volumes:
  gameshelf-data:
