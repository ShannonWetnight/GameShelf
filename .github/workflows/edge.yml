name: Edge tests and prerelease
# Edge launcher only; test implementation lives on edge.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a test prerelease from Edge
        type: boolean
        default: false
permissions:
  actions: write
jobs:
  start-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the workflow on Edge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          gh workflow run edge.yml --repo "$GITHUB_REPOSITORY" --ref edge -f "publish=$PUBLISH"
          echo 'Started Edge testing. Open the Edge run in Actions for its results and packages.' >> "$GITHUB_STEP_SUMMARY"
