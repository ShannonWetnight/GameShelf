name: Edge tests and prerelease

on:
  push:
    branches: [edge]
  pull_request:
    branches: [main, edge]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a test release and update the Docker edge tag (select edge above)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare test package and change notes
        id: prepare
        env:
          CHANNEL: edge
        run: python3 scripts/release.py prepare
      - uses: ./.github/actions/verify
      - name: Package the tested image
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gameshelf-${{ steps.prepare.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/edge'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this run's tested package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.test.outputs.version }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "gameshelf-$VERSION" --dir dist
      - name: Publish Edge prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: edge
          VERSION: ${{ needs.test.outputs.version }}
        run: bash scripts/publish.sh
