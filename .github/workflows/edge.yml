name: Edge tests and Docker image
run-name: ${{ inputs.request_id || format('Edge {0} / {1}', github.event_name, github.ref_name) }}
on:
  push:
    branches: [edge]
  pull_request:
    branches: [edge]
  workflow_dispatch:
    inputs:
      publish:
        description: Update the Edge Docker image (no GitHub Release)
        type: boolean
        default: false
      promote_version:
        description: Planned stable version for a draft main PR (e.g. v2.2.0; no tag is created; blank disables)
        type: string
      source_sha:
        description: Exact main commit to verify for a stable release (normally blank)
        type: string
      stable_version:
        description: Stable package version requested by the main release Action
        type: string
      request_id:
        description: Stable release request identifier (normally blank)
        type: string
permissions:
  contents: read
concurrency:
  group: edge-${{ inputs.publish && 'publication' || inputs.request_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verified-package:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.verified.outputs.version }}
      run_id: ${{ steps.verified.outputs.run_id }}
      artifact_id: ${{ steps.verified.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reuse the exact successful Edge verification
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STABLE_VERSION: ${{ inputs.stable_version }}
          REQUEST_ID: ${{ inputs.request_id }}
          PROMOTE_VERSION: ${{ inputs.promote_version }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/edge ]]
          [[ -z "$SOURCE_SHA$STABLE_VERSION$REQUEST_ID$PROMOTE_VERSION" ]]
          python3 scripts/verified-edge.py select
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    env:
      VERIFY_WORKSPACE: ${{ github.workspace }}/verification
    steps:
      - name: Checkout the Edge harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the verification request
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          STABLE_VERSION: ${{ inputs.stable_version }}
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLISH: ${{ inputs.publish }}
          PROMOTE_VERSION: ${{ inputs.promote_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/edge ]]; then
            echo 'Run the full Edge workflow from edge.' >&2; exit 1
          fi
          if [[ -n "$SOURCE_SHA" ]]; then
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$STABLE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$REQUEST_ID" =~ ^stable-[0-9]+-[0-9]+$ ]]
            [[ "$PUBLISH" != true && -z "$PROMOTE_VERSION" ]]
            git -C tooling merge-base --is-ancestor "$SOURCE_SHA" origin/main
            echo 'CHANNEL=stable' >> "$GITHUB_ENV"
            echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
            echo 'SOURCE_REF=refs/heads/main' >> "$GITHUB_ENV"
          else
            [[ -z "$STABLE_VERSION" && -z "$REQUEST_ID" ]]
            if [[ -n "$PROMOTE_VERSION" ]]; then
              [[ "$PROMOTE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              [[ "$PUBLISH" != true ]]
            fi
            echo 'CHANNEL=edge' >> "$GITHUB_ENV"
            echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "SOURCE_REF=$GITHUB_REF" >> "$GITHUB_ENV"
          fi
      - name: Checkout the pristine source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the source-specific package and notes
        id: prepare
        working-directory: candidate
        env:
          VERSION: ${{ inputs.stable_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$CHANNEL" == stable ]]; then
            python3 .github/scripts/release.py check-tree
          fi
          GITHUB_SHA="$SOURCE_SHA" GITHUB_REF="$SOURCE_REF" python3 "$GITHUB_WORKSPACE/tooling/scripts/release.py" prepare
      - name: Overlay Edge tests into a temporary verification copy
        run: |
          mkdir -p "$VERIFY_WORKSPACE"
          git -C candidate archive "$SOURCE_SHA" | tar -x -C "$VERIFY_WORKSPACE"
          cp tooling/main_test.go "$VERIFY_WORKSPACE/main_test.go"
          mkdir -p "$VERIFY_WORKSPACE/tests" "$VERIFY_WORKSPACE/scripts"
          cp tooling/tests/*.test.cjs tooling/tests/browser-fixture.cjs tooling/tests/browser-pool.cjs tooling/tests/live-browser.cjs "$VERIFY_WORKSPACE/tests/"
          cp tooling/scripts/docker-smoke.py tooling/scripts/scan.sh tooling/scripts/verify.py tooling/scripts/verify-lane.sh "$VERIFY_WORKSPACE/scripts/"
      - uses: ./tooling/.github/actions/verify
      - name: Package the verified image and pristine source
        working-directory: candidate
        run: GITHUB_SHA="$SOURCE_SHA" bash "$GITHUB_WORKSPACE/tooling/scripts/package.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gameshelf-${{ steps.prepare.outputs.version }}
          path: candidate/dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.source_sha && github.ref == 'refs/heads/edge'
    needs: verified-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate and download the verified push package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verified-package.outputs.version }}
          VERIFIED_EDGE_RUN_ID: ${{ needs.verified-package.outputs.run_id }}
          VERIFIED_EDGE_ARTIFACT_ID: ${{ needs.verified-package.outputs.artifact_id }}
        run: python3 scripts/verified-edge.py download
      - name: Update Edge Docker image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: edge
          VERSION: ${{ needs.verified-package.outputs.version }}
          VERIFIED_EDGE_RUN_ID: ${{ needs.verified-package.outputs.run_id }}
        run: bash scripts/publish-edge.sh

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_version != '' && !inputs.source_sha && !inputs.publish && github.ref == 'refs/heads/edge'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout the tested Edge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout main's public file rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: public
          persist-credentials: false
      - name: Create a selective draft release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_VERSION: ${{ inputs.promote_version }}
        run: python3 tooling/.github/scripts/promote.py
