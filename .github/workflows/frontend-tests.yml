name: Frontend tests

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/frontend-tests.yml'
  push:
    branches: [main, edge]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/frontend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --test tests/frontend.test.cjs
