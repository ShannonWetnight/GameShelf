name: Publish stable release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: New stable version, for example v2.2.0 (select main)
        required: true
        type: string
      check_only:
        description: Validate the public source tree without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: main-release-${{ github.event_name == 'workflow_dispatch' && !inputs.check_only && 'publish' || github.ref }}
  cancel-in-progress: false
jobs:
  public-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Keep development tooling off main
        run: python3 .github/scripts/release.py check-tree
  verify:
    if: github.event_name == 'workflow_dispatch' && !inputs.check_only
    needs: public-files
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    outputs:
      run_id: ${{ steps.edge.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and notes
        env:
          CHANNEL: stable
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py prepare
      - name: Verify and package this main commit on Edge
        id: edge
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py verify-on-edge
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the package verified on Edge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          EDGE_RUN_ID: ${{ needs.verify.outputs.run_id }}
        run: gh run download "$EDGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "gameshelf-$VERSION" --dir dist
      - name: Publish the verified public bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: stable
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/publish.sh
