name: Verify GameShelf
description: Test and scan the exact image with trusted caches and bounded parallel checks
runs:
  using: composite
  steps:
    - name: Configure isolated build and compiler caches
      shell: bash
      run: |
        echo "CI_CACHE_ROOT=$RUNNER_TEMP/gameshelf-cache" >> "$GITHUB_ENV"
        echo "CI_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
        echo "CI_DEPENDENCY_KEY=$(sha256sum "$VERIFY_WORKSPACE/Dockerfile" "$VERIFY_WORKSPACE/go.mod" "$VERIFY_WORKSPACE/connectors/rclone/go.mod" "$VERIFY_WORKSPACE/connectors/rclone/go.sum" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
    - name: Restore trusted build cache
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/gameshelf-cache
        key: gameshelf-ci-v1-${{ runner.os }}-${{ env.CI_DEPENDENCY_KEY }}-${{ env.CI_CACHE_DATE }}-${{ github.sha }}
        restore-keys: |
          gameshelf-ci-v1-${{ runner.os }}-${{ env.CI_DEPENDENCY_KEY }}-${{ env.CI_CACHE_DATE }}-
          gameshelf-ci-v1-${{ runner.os }}-${{ env.CI_DEPENDENCY_KEY }}-
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Use Node 24 for isolated browser sessions
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '24'
    - name: Build runtime and matching builder
      shell: bash
      working-directory: ${{ env.VERIFY_WORKSPACE }}
      run: |
        mkdir -p reports "$CI_CACHE_ROOT/go/build" "$CI_CACHE_ROOT/go/mod"
        chmod -R a+rwX "$CI_CACHE_ROOT/go"
        args=(--platform linux/amd64 --load --build-arg "GAMESHELF_BUILD_VERSION=$VERSION"
          --build-arg "GAMESHELF_BUILD_CHANNEL=$CHANNEL" --build-arg "GAMESHELF_SECURITY_EPOCH=$CI_CACHE_DATE")
        if [[ -f "$CI_CACHE_ROOT/docker/index.json" ]]; then args+=(--cache-from "type=local,src=$CI_CACHE_ROOT/docker"); fi
        docker buildx build --pull "${args[@]}" --cache-to "type=local,dest=$RUNNER_TEMP/gameshelf-buildcache-next,mode=max" \
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=${SOURCE_SHA:-$GITHUB_SHA}" --tag gameshelf:candidate .
        docker buildx build "${args[@]}" --target build --tag gameshelf:builder .
        rm -rf "$CI_CACHE_ROOT/docker"
        mv "$RUNNER_TEMP/gameshelf-buildcache-next" "$CI_CACHE_ROOT/docker"
        docker image inspect gameshelf:candidate > reports/runtime-image.json
        docker image inspect gameshelf:builder > reports/builder-image.json
    - name: Run all verification lanes (two at a time)
      shell: bash
      working-directory: ${{ env.VERIFY_WORKSPACE }}
      run: python3 scripts/verify.py
    - name: Save cache only from successful trusted Edge pushes
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/edge' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/gameshelf-cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Preserve verification results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: verification-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.VERIFY_WORKSPACE }}/reports/
        if-no-files-found: warn
        retention-days: 30
